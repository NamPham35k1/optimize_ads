version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: auto-ads-care-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:/app/backend/prisma/dev.db
      - ENCRYPTION_KEY=auto-ads-care-secret-key-32chr!
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_API_VERSION=v22.0
      - META_REDIRECT_URI=${META_REDIRECT_URI:-http://localhost:5000/api/auth/meta/callback}
      - DEFAULT_USER_EMAIL=admin@autoadscare.io
      - SCHEDULER_CRON=*/1 * * * *
      - EMERGENCY_STOP=false
      - ENABLE_MOCK_FALLBACK=true
    volumes:
      - backend-db:/app/backend/prisma

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: auto-ads-care-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-db:
